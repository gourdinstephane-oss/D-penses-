<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Suivi Mensuel — Moyennes</title>

<meta name="theme-color" content="#f6f1e4">
<link rel="manifest" href="manifest.json">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --ink: #132a22;
    --jar-green: #1b3a2f;
    --jar-green-light: #2b5142;
    --gold: #c9a227;
    --cream: #f6f1e4;
    --copper: #a85c32;
    --line: rgba(19,42,34,0.12);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100vh; min-height: -webkit-fill-available;
    background-color: var(--cream) !important; color: var(--ink);
    font-family: 'JetBrains Mono', monospace; overscroll-behavior: none;
  }

  body {
    padding: 28px 18px calc(20px + env(safe-area-inset-bottom, 20px));
    display: flex; flex-direction: column; align-items: center;
  }

  .wrap { width: 100%; max-width: 460px; }

  .eyebrow {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--copper); text-align: center; margin-bottom: 6px; font-weight: 700;
  }

  h1 {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px;
    text-align: center; margin: 0 0 24px; color: var(--jar-green); letter-spacing: -0.01em;
  }

  .month-card {
    background: white; border: 2px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 20px; transition: border-color 0.2s;
  }
  .month-card.current {
    border-color: var(--jar-green);
    background: linear-gradient(180deg, rgba(27,58,47,0.03), rgba(27,58,47,0.08));
  }

  .month-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px;
  }
  .month-title {
    font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: var(--jar-green);
  }
  .badge-current {
    font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    background: var(--copper); color: white; padding: 3px 6px; border-radius: 6px; font-weight: 700;
  }

  .stats-row {
    display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;
  }
  .avg-val { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; color: var(--jar-green); }
  .avg-label { font-size: 10px; text-transform: uppercase; color: var(--copper); font-weight: 700; }
  .days-info { font-size: 11px; color: var(--jar-green-light); text-align: right; }

  .entry-form { display: flex; gap: 6px; margin-bottom: 12px; }
  .entry-form input {
    flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 14px;
    padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: white; color: var(--ink); outline: none;
  }
  .entry-form input:focus { border-color: var(--gold); }
  .entry-form button {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 12px;
    padding: 8px 12px; border-radius: 8px; border: none;
    background: var(--jar-green); color: var(--cream); cursor: pointer;
  }

  .tags-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--cream); border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 8px; font-size: 12px;
  }
  .tag button {
    background: none; border: none; color: var(--copper); font-size: 12px;
    cursor: pointer; padding: 0; line-height: 1;
  }

  .empty { font-size: 11px; color: var(--jar-green-light); opacity: 0.6; font-style: italic; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Calculateur annuel</div>
    <h1 id="yearTitle">Moyennes 2026</h1>

    <div id="monthsContainer"></div>
  </div>

<script>
const KEY = 'monthly-tracker-all-months';
const MONTHS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

let store = JSON.parse(localStorage.getItem(KEY) || '{}');
const today = new Date();
const currentYear = today.getFullYear();
const currentMonthIdx = today.getMonth();

document.getElementById('yearTitle').textContent = `Moyennes ${currentYear}`;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

function getEffectiveDays(monthIdx) {
  const totalDaysInMonth = new Date(currentYear, monthIdx + 1, 0).getDate();

  if (monthIdx === currentMonthIdx) return today.getDate();
  if (monthIdx < currentMonthIdx) return totalDaysInMonth;
  return 0;
}

const parseAmount = str => str ? parseFloat(str.replace(/\s/g, '').replace(',', '.').replace('€', '')) : NaN;
const fmt = n => n.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';

function render() {
  const container = document.getElementById('monthsContainer');
  
  container.innerHTML = MONTHS.map((m, i) => {
    const entries = store[i] || [];
    const days = getEffectiveDays(i);
    const isCurrent = i === currentMonthIdx;
    const totalSum = entries.reduce((s, a) => s + a, 0);
    const avg = days > 0 ? totalSum / days : 0;

    return `
      <div class="month-card ${isCurrent ? 'current' : ''}">
        <div class="month-header">
          <div class="month-title">${m}</div>
          ${isCurrent ? '<span class="badge-current">En cours</span>' : ''}
        </div>

        <div class="stats-row">
          <div>
            <div class="avg-label">Moyenne / jour</div>
            <div class="avg-val">${fmt(avg)}</div>
          </div>
          <div class="days-info">
            Total : <b>${fmt(totalSum)}</b><br>
            ${days > 0 ? `Sur <b>${days} j</b>` : '<i>Mois futur</i>'}
          </div>
        </div>

        <div class="entry-form">
          <input type="text" inputmode="decimal" id="input-${i}" placeholder="Ajouter un montant" autocomplete="off">
          <button type="button" onclick="addEntry(${i})">+</button>
        </div>

        <div class="tags-list">
          ${entries.length === 0 ? '<span class="empty">Aucun montant</span>' : ''}
          ${entries.map((amt, idx) => `
            <span class="tag">
              ${fmt(amt)}
              <button type="button" onclick="delEntry(${i}, ${idx})">✕</button>
            </span>
          `).join('')}
        </div>
      </div>
    `;
  }).join('');

  MONTHS.forEach((_, i) => {
    const input = document.getElementById(`input-${i}`);
    if (input) {
      input.onkeydown = e => { if (e.key === 'Enter') addEntry(i); };
    }
  });

  localStorage.setItem(KEY, JSON.stringify(store));
}

function addEntry(monthIdx) {
  const input = document.getElementById(`input-${monthIdx}`);
  const amt = parseAmount(input.value);
  if (isNaN(amt) || amt <= 0) return;

  if (!store[monthIdx]) store[monthIdx] = [];
  store[monthIdx].push(Math.round(amt * 100) / 100);
  render();
}

function delEntry(monthIdx, entryIdx) {
  store[monthIdx].splice(entryIdx, 1);
  render();
}

render();
</script>
</body>
</html>

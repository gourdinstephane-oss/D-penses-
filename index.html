<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calculateur de dépenses moyennes</title>

<meta name="theme-color" content="#f6f1e4">
<link rel="manifest" href="manifest.json">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root {
    --ink: #132a22;
    --jar-green: #1b3a2f;
    --jar-green-light: #2b5142;
    --gold: #c9a227;
    --cream: #f8f5eb;
    --copper: #a85c32;
    --line: rgba(19, 42, 34, 0.1);
    --card-bg: rgba(255, 255, 255, 0.5);
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100vh; min-height: -webkit-fill-available;
    background-color: var(--cream); color: var(--ink);
    font-family: 'JetBrains Mono', monospace; overscroll-behavior: none;
  }

  body {
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 24px));
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  }

  .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; flex: 1; gap: 20px; }

  .eyebrow {
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--copper); text-align: center; font-weight: 700;
  }

  /* Carte statistiques modernisée */
  .stats-card {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.7), rgba(27, 58, 47, 0.05));
    border: 1.5px solid var(--jar-green); border-radius: 20px;
    padding: 22px 20px; text-align: center; width: 100%;
    box-shadow: 0 4px 20px rgba(19, 42, 34, 0.04);
  }
  .stat-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--copper); font-weight: 700; }
  .stat-main { font-family: 'Fraunces', serif; font-weight: 700; font-size: 46px; color: var(--jar-green); margin: 6px 0 10px; line-height: 1; }
  .stat-sub { font-size: 12px; color: var(--jar-green-light); border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
  .stat-sub span { font-weight: 700; color: var(--copper); }

  /* Formulaire avec plus de relief */
  .entry-form { display: flex; flex-direction: column; gap: 10px; width: 100%; }
  .input-group { display: flex; gap: 10px; }
  
  .entry-form select, .entry-form input, .entry-form button {
    font-family: inherit; border-radius: 12px; outline: none; transition: all 0.2s ease;
  }

  .entry-form select {
    font-size: 14px; font-weight: 600; padding: 12px 14px;
    border: 1.5px solid var(--line); background: white; color: var(--jar-green);
    cursor: pointer; width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }

  .entry-form input {
    flex: 1; font-size: 15px; padding: 12px 14px;
    border: 1.5px solid var(--line); background: white; color: var(--ink); width: 100%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.02);
  }
  .entry-form input:focus, .entry-form select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.15); }
  
  .entry-form button {
    font-weight: 700; font-size: 13px; padding: 12px 20px;
    border: none; background: var(--jar-green); color: var(--cream); cursor: pointer;
    box-shadow: 0 4px 12px rgba(27, 58, 47, 0.15);
  }
  .entry-form button:active { transform: scale(0.98); }

  /* Tableau aéré */
  .ledger-container { width: 100%; flex: 1; margin-top: 4px; }
  .ledger-table { width: 100%; border-collapse: collapse; }
  
  .ledger-table th {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--copper); font-weight: 700; padding: 0 4px 8px;
    border-bottom: 1.5px solid var(--line); text-align: left;
  }
  .ledger-table th.col-val { padding-left: 16px; }

  .ledger-table td { padding: 13px 4px; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .ledger-table .month-col { color: var(--ink); text-align: left; font-weight: 500; width: 55%; }
  .ledger-table .month-col b { color: var(--copper); font-weight: 600; }
  .ledger-table .val-col { text-align: left; color: var(--jar-green); font-weight: 700; width: 33%; padding-left: 16px; }
  .ledger-table .val-col .sub-info { font-size: 10px; font-weight: 500; color: var(--copper); display: block; margin-top: 2px; }
  
  .ledger-table .del-cell { text-align: right; width: 12%; }
  .ledger-table .del-btn {
    background: rgba(168, 92, 50, 0.12); border: none; color: var(--copper);
    font-size: 12px; font-weight: 700; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    transition: all 0.2s;
  }
  .ledger-table .del-btn:hover { background: var(--copper); color: white; }

  /* Bouton réinitialiser */
  .reset-row { margin-top: auto; padding-top: 12px; text-align: center; width: 100%; }
  .reset {
    font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
    background: transparent; border: 1.5px solid var(--copper); color: var(--copper);
    padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: 600;
    transition: all 0.2s ease;
  }
  .reset:active { background: rgba(168, 92, 50, 0.1); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Calculateur de dépenses moyennes</div>

    <div class="stats-card">
      <div class="stat-label">Moyenne mensuelle</div>
      <div class="stat-main" id="avgResult">0,00 €</div>
      <div class="stat-sub" id="totalDetail">Total réel cumulé : <span>0,00 €</span></div>
    </div>

    <div class="entry-form">
      <select id="monthSelect"></select>
      <div class="input-group">
        <input type="text" inputmode="decimal" id="amountInput" placeholder="Montant, ex. 45,00" autocomplete="off">
        <button type="button" id="addBtn">Ajouter</button>
      </div>
    </div>

    <div class="ledger-container">
      <table class="ledger-table">
        <thead>
          <tr>
            <th>Mois</th>
            <th class="col-val">Montant</th>
            <th style="width:12%"></th>
          </tr>
        </thead>
        <tbody id="ledger"></tbody>
      </table>
    </div>

    <div class="reset-row">
      <button class="reset" id="resetBtn" type="button">Tout remettre à zéro</button>
    </div>
  </div>

<script>
const KEY = 'monthly-tracker-table';
const MONTHS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

const today = new Date();
const currentYear = today.getFullYear();
const currentMonthIdx = today.getMonth();

let store = JSON.parse(localStorage.getItem(KEY) || '{}');

const $ = id => document.getElementById(id);
const dom = {
  select: $('monthSelect'),
  input: $('amountInput'),
  ledger: $('ledger'),
  avgResult: $('avgResult'),
  totalDetail: $('totalDetail'),
  addBtn: $('addBtn'),
  resetBtn: $('resetBtn')
};

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

function initMonthSelect() {
  dom.select.innerHTML = MONTHS.map((m, idx) => `
    <option value="${idx}" ${idx === currentMonthIdx ? 'selected' : ''}>
      ${m} ${currentYear} ${idx === currentMonthIdx ? '(en cours)' : ''}
    </option>
  `).join('');
}

const parseAmount = str => {
  if (!str) return NaN;
  return parseFloat(str.replace(/\s/g, '').replace(',', '.').replace('€', ''));
};

const fmt = n => n.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';

function render() {
  let grandTotal = 0;
  let activeMonthsCount = 0;
  let projectedGrandTotal = 0;

  const dayOfMonth = today.getDate();
  const totalDaysInCurrentMonth = new Date(currentYear, currentMonthIdx + 1, 0).getDate();

  dom.ledger.innerHTML = MONTHS.map((monthName, idx) => {
    const rawAmount = store[idx] || 0;
    const isCurrent = idx === currentMonthIdx;
    let note = '';

    if (isCurrent) {
      const projected = dayOfMonth > 0 ? (rawAmount / dayOfMonth) * totalDaysInCurrentMonth : 0;
      projectedGrandTotal += projected;
      if (rawAmount > 0) {
        activeMonthsCount += 1;
        note = `<span class="sub-info">(Prorata : ${fmt(projected)})</span>`;
      }
    } else {
      if (rawAmount > 0) activeMonthsCount += 1;
      projectedGrandTotal += rawAmount;
    }

    grandTotal += rawAmount;

    return `
      <tr id="row-month-${idx}">
        <td class="month-col">${monthName} ${currentYear} ${isCurrent ? '<b>(en cours)</b>' : ''}</td>
        <td class="val-col">${fmt(rawAmount)} ${note}</td>
        <td class="del-cell">
          ${rawAmount > 0 ? `<button type="button" class="del-btn" data-month="${idx}">✕</button>` : ''}
        </td>
      </tr>
    `;
  }).join('');

  const overallAvg = activeMonthsCount > 0 ? projectedGrandTotal / activeMonthsCount : 0;

  dom.avgResult.textContent = fmt(overallAvg);
  dom.totalDetail.innerHTML = `Total réel cumulé : <span>${fmt(grandTotal)}</span>`;

  localStorage.setItem(KEY, JSON.stringify(store));
}

function addEntry() {
  const selectedIdx = parseInt(dom.select.value, 10);
  const amt = parseAmount(dom.input.value);
  
  if (isNaN(amt) || amt <= 0) return;

  const currentVal = store[selectedIdx] || 0;
  store[selectedIdx] = Math.round((currentVal + amt) * 100) / 100;
  
  dom.input.value = '';
  render();
}

dom.addBtn.addEventListener('click', addEntry);
dom.input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    addEntry();
  }
});

dom.ledger.addEventListener('click', e => {
  const btn = e.target.closest('.del-btn');
  if (btn) {
    delete store[btn.dataset.month];
    render();
  }
});

dom.resetBtn.addEventListener('click', () => { 
  store = {}; 
  render(); 
});

initMonthSelect();
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Calculateur de dépenses moyennes</title>

<meta name="theme-color" content="#f6f1e4">
<link rel="manifest" href="manifest.json">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root {
    --ink: #132a22;
    --jar-green: #1b3a2f;
    --jar-green-light: #2b5142;
    --gold: #c9a227;
    --cream: #f6f1e4;
    --copper: #a85c32;
    --line: rgba(19,42,34,0.12);
    color-scheme: light;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; width: 100%; min-height: 100vh; min-height: -webkit-fill-available;
    background-color: var(--cream) !important; color: var(--ink);
    font-family: 'JetBrains Mono', monospace; overscroll-behavior: none;
  }

  body {
    padding: 16px 14px calc(16px + env(safe-area-inset-bottom, 16px));
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    min-height: 100vh;
  }

  .wrap { width: 100%; max-width: 100%; display: flex; flex-direction: column; flex: 1; }

  .eyebrow {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--copper); text-align: center; margin-bottom: 14px; font-weight: 700;
  }

  .stats-card {
    background: linear-gradient(180deg, rgba(27,58,47,0.06), rgba(27,58,47,0.11));
    border: 2px solid var(--jar-green); border-radius: 16px;
    padding: 18px 16px; text-align: center; margin-bottom: 16px; width: 100%;
  }
  .stat-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--copper); font-weight: 700; }
  .stat-main { font-family: 'Fraunces', serif; font-weight: 700; font-size: 44px; color: var(--jar-green); margin: 4px 0 8px; }
  .stat-sub { font-size: 12px; color: var(--jar-green-light); border-top: 1px dashed var(--line); padding-top: 8px; }
  .stat-sub span { font-weight: 700; color: var(--copper); }

  .entry-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; width: 100%; }
  .input-group { display: flex; gap: 8px; }
  
  .entry-form select {
    font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700;
    padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line);
    background: white; color: var(--jar-green); outline: none; cursor: pointer; width: 100%;
  }

  .entry-form input {
    flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 15px;
    padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--line);
    background: white; color: var(--ink); outline: none; width: 100%;
  }
  .entry-form input:focus, .entry-form select:focus { border-color: var(--gold); }
  
  .entry-form button {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px;
    padding: 11px 18px; border-radius: 10px; border: none;
    background: var(--jar-green); color: var(--cream); cursor: pointer;
  }

  .ledger-container { overflow: visible; width: 100%; flex: 1; }
  .ledger-table { width: 100%; border-collapse: collapse; }
  
  .ledger-table th {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--copper); font-weight: 700; padding: 0 2px 6px;
    border-bottom: 1px solid var(--line); text-align: left;
  }
  .ledger-table th.col-val { text-align: left; padding-left: 16px; }

  .ledger-table td { padding: 11px 2px; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
  .ledger-table .month-col { color: var(--ink); text-align: left; font-weight: 500; width: 55%; }
  .ledger-table .val-col { text-align: left; color: var(--jar-green); font-weight: 700; width: 33%; padding-left: 16px; }
  .ledger-table .val-col .sub-info { font-size: 10px; font-weight: 400; color: var(--copper); display: block; }
  
  .ledger-table .del-cell { text-align: right; width: 12%; }
  .ledger-table .del-btn {
    background: var(--copper); border: none; color: white;
    font-size: 11px; font-weight: 700; cursor: pointer; padding: 3px 7px; border-radius: 4px;
    display: inline-block;
  }

  .reset-row { margin-top: auto; padding-top: 16px; text-align: center; width: 100%; }
  .reset {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase;
    background: none; border: 1px solid var(--copper); color: var(--copper);
    padding: 8px 16px; border-radius: 18px; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Calculateur de dépenses moyennes</div>

    <div class="stats-card">
      <div class="stat-label">Moyenne mensuelle</div>
      <div class="stat-main" id="avgResult">0,00 €</div>
      <div class="stat-sub" id="totalDetail">Total réel cumulé : <span>0,00 €</span></div>
    </div>

    <div class="entry-form">
      <select id="monthSelect"></select>
      <div class="input-group">
        <input type="text" inputmode="decimal" id="amountInput" placeholder="Montant, ex. 45,00" autocomplete="off">
        <button type="button" id="addBtn">Ajouter</button>
      </div>
    </div>

    <div class="ledger-container" id="ledgerContainer">
      <table class="ledger-table">
        <thead>
          <tr>
            <th>Mois</th>
            <th class="col-val">Montant</th>
            <th style="width:12%"></th>
          </tr>
        </thead>
        <tbody id="ledger"></tbody>
      </table>
    </div>

    <div class="reset-row">
      <button class="reset" id="resetBtn" type="button">Tout remettre à zéro</button>
    </div>
  </div>

<script>
const KEY = 'monthly-tracker-table';
const MONTHS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

let store = JSON.parse(localStorage.getItem(KEY) || '{}');
const today = new Date();
const currentYear = today.getFullYear();
const currentMonthIdx = today.getMonth();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

function initMonthSelect() {
  const select = document.getElementById('monthSelect');
  select.innerHTML = MONTHS.map((m, idx) => `
    <option value="${idx}" ${idx === currentMonthIdx ? 'selected' : ''}>
      ${m} ${currentYear} ${idx === currentMonthIdx ? '(en cours)' : ''}
    </option>
  `).join('');
}

const parseAmount = str => str ? parseFloat(str.replace(/\s/g, '').replace(',', '.').replace('€', '')) : NaN;
const fmt = n => n.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €';

function render() {
  const ledger = document.getElementById('ledger');
  let grandTotal = 0;
  let activeMonthsCount = 0;
  let projectedGrandTotal = 0;

  const dayOfMonth = today.getDate();
  const totalDaysInCurrentMonth = new Date(currentYear, currentMonthIdx + 1, 0).getDate();

  ledger.innerHTML = MONTHS.map((monthName, idx) => {
    const rawAmount = store[idx] || 0;
    const isCurrent = idx === currentMonthIdx;

    let note = '';

    if (isCurrent) {
      const projected = dayOfMonth > 0 ? (rawAmount / dayOfMonth) * totalDaysInCurrentMonth : 0;
      projectedGrandTotal += projected;
      if (rawAmount > 0) activeMonthsCount += 1;
      if (rawAmount > 0) note = `<span class="sub-info">(Prorata : ${fmt(projected)})</span>`;
    } else {
      if (rawAmount > 0) activeMonthsCount += 1;
      projectedGrandTotal += rawAmount;
    }

    grandTotal += rawAmount;

    return `
      <tr id="row-month-${idx}">
        <td class="month-col">${monthName} ${currentYear} ${isCurrent ? '<b>(en cours)</b>' : ''}</td>
        <td class="val-col">${fmt(rawAmount)} ${note}</td>
        <td class="del-cell">
          ${rawAmount > 0 ? `<button type="button" class="del-btn" data-month="${idx}">✕</button>` : ''}
        </td>
      </tr>
    `;
  }).join('');

  const overallAvg = activeMonthsCount > 0 ? projectedGrandTotal / activeMonthsCount : 0;

  document.getElementById('avgResult').textContent = fmt(overallAvg);
  document.getElementById('totalDetail').innerHTML = `Total réel cumulé : <span>${fmt(grandTotal)}</span>`;

  localStorage.setItem(KEY, JSON.stringify(store));
}

function addEntry() {
  const input = document.getElementById('amountInput');
  const monthSelect = document.getElementById('monthSelect');
  const selectedIdx = parseInt(monthSelect.value, 10);
  const amt = parseAmount(input.value);
  
  if (isNaN(amt) || amt <= 0) return;

  const currentVal = store[selectedIdx] || 0;
  store[selectedIdx] = Math.round((currentVal + amt) * 100) / 100;
  
  input.value = '';
  render();
}

document.getElementById('addBtn').addEventListener('click', addEntry);
document.getElementById('amountInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    addEntry();
  }
});

document.getElementById('ledger').addEventListener('click', (e) => {
  if (e.target.classList.contains('del-btn')) {
    const monthIdx = e.target.dataset.month;
    delete store[monthIdx];
    render();
  }
});

document.getElementById('resetBtn').addEventListener('click', () => { 
  store = {}; 
  render(); 
});

initMonthSelect();
render();
</script>
</body>
</html>
